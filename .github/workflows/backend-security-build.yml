name: Project validation

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
    paths:
      - "**"

concurrency:
  group: project-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend install, Prisma generation, and compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=restaurant;user=sa;password=Strong_password123;encrypt=true;trustServerCertificate=true"
      JWT_SECRET: "ci-only-secret-with-at-least-32-characters"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Compile backend
        run: npm run build

  frontend-build:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
