name: Backend security build

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-security-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=restaurant;user=sa;password=Strong_password123;encrypt=true;trustServerCertificate=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Compile backend
        run: npm run build

      - name: Refresh tracked production build output on security branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh backend dist for security patch"
            git push
          fi
